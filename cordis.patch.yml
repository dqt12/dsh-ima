# dsh-ima bundle patch
#
# 宿主半（lib/index.js）：
#   · inject ['tools'] → 注册 4 个 agent 工具
#   · inject ['webServer'] → 注册 /api/ima/* 路由（浏览器半通过同源 fetch 调用）
# 浏览器半（lib/client.js）：
#   · sidebar.panellist → 「知识库 ima」入口
#   · main → key 为 dsh-ima 的主区面板
# 两半共用这一行。

- insert:
    - id: dsh-ima
      name: dsh-ima
